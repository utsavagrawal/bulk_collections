<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script data-goatcounter="https://projekut.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<title>Bulk Collections</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive case study of Bulk Collections, a billing product architected by Utsav Agrawal. Scroll to explore the system design and the results.">
<meta property="og:title" content="Bulk Collections">
<meta property="og:description" content="An interactive, endlessly scrolling look at the system design behind Bulk Collections.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: one vertical pipeline rail. Each stage pins to the screen and scrolling scrubs through its steps,
   so the whole page feels like one continuous motion. The cycle is rendered three times and the scroll position wraps. */
:root{
  --bg:#E8EEF0; --surface:#F7FAFB; --ink:#0F2229; --muted:#4F656C; --line:#B5C5CA;
  --accent:#2349E8; --accent-ink:#FFFFFF; --accent-soft:#D9E2FB;
  --good:#0B7A52; --warn:#94600F; --bad:#B63A3A;
  --viz-bg:#F2F7FA; --viz-tube:#6F88FF; --viz-sheet:#A9BAFF; --viz-grid:#D3E0E6; --viz-wall:#9FB4BD;
  --coin:#F6CB5A; --coin-edge:#B98622;
  --paper:#FFFFFF; --paper-ink:#0F2229; --paper-line:#C9D5D9;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --vh:1vh; --hudh:84px; color-scheme:light;
}
@supports (height:100svh){:root{--vh:1svh}}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C171B; --surface:#13242A; --ink:#E6F0F2; --muted:#8FA6AD; --line:#2A424B;
    --accent:#7C93FF; --accent-ink:#0C171B; --accent-soft:#1E2B57;
    --good:#3FCB92; --warn:#E5B454; --bad:#F07575; color-scheme:dark;
    --viz-bg:#1F3742; --viz-tube:#A3B4FF; --viz-sheet:#7C93FF; --viz-grid:#37535F; --viz-wall:#7F9BA7;
    --coin:#F2C14E; --coin-edge:#8A6114; --paper:#EDF3F5; --paper-ink:#0F2229; --paper-line:#BFCCD1;
  }
}
:root[data-theme="dark"]{
  --bg:#0C171B; --surface:#13242A; --ink:#E6F0F2; --muted:#8FA6AD; --line:#2A424B;
  --accent:#7C93FF; --accent-ink:#0C171B; --accent-soft:#1E2B57;
  --good:#3FCB92; --warn:#E5B454; --bad:#F07575; color-scheme:dark;
  --viz-bg:#1F3742; --viz-tube:#A3B4FF; --viz-sheet:#7C93FF; --viz-grid:#37535F; --viz-wall:#7F9BA7;
  --coin:#F2C14E; --coin-edge:#8A6114; --paper:#EDF3F5; --paper-ink:#0F2229; --paper-line:#BFCCD1;
}
[hidden]{display:none!important}

*{box-sizing:border-box}
html{overflow-anchor:none}
body{overflow-x:clip}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* HUD */
.hud{
  position:fixed; top:0; left:0; right:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
}
.hud-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hud-name{font:800 20px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.hud-stage{flex:1;min-width:0;text-align:center;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-loop{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hud-loop b{color:var(--ink)}
.theme{border:1.5px solid var(--line);background:var(--surface);border-radius:3px;padding:4px 8px;font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}

/* Rail + packet */
.wrap{max-width:880px;margin:0 auto}
.track{position:relative}
.track::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
.packet{
  position:fixed; left:var(--rail-x,28px); top:62%; width:14px; height:14px; margin-left:-7px; z-index:5;
  border-radius:50%; background:var(--accent); pointer-events:none;
  box-shadow:0 0 0 4px var(--accent-soft); animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion: reduce){.packet{animation:none}.c,.chip,.sc{transition:none!important}}

/* Stage: tall scroll track with a pinned panel inside */
.stage{position:relative;height:calc(var(--vh)*100 + var(--F,0)*var(--vh)*55)}
.pin{
  position:sticky; top:0; height:calc(var(--vh)*100);
  padding:calc(var(--hudh) + 14px) 0 20px 44px; display:flex; flex-direction:column; justify-content:center; gap:14px;
}
.pin>*{max-width:720px;min-width:0}
.eyebrow{position:relative;display:flex;align-items:center;gap:12px;font:500 12px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{
  content:""; position:absolute; left:-43px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; border-radius:50%; background:var(--bg); border:2px solid var(--ink);
}
.steps{display:flex;gap:4px}
.steps i{display:block;width:18px;height:4px;background:var(--line);transition:background .2s}
.steps i.on{background:var(--accent)}
h2{margin:0;font:800 clamp(38px,8vw,60px)/.9 var(--font-display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
h2.mega{font-weight:900;font-size:clamp(32px,min(10.8vw,96px),96px);line-height:.88;letter-spacing:-.01em;white-space:nowrap}
.lede{margin:0;font-size:clamp(18px,3.4vw,22px);color:var(--muted);max-width:30ch}
.facts{display:flex;flex-wrap:wrap;gap:10px 32px}
.facts div{display:flex;flex-direction:column}
.facts b{font:800 34px/1 var(--font-display);letter-spacing:.01em}
.facts i{font-style:normal;color:var(--accent);padding:0 .2em}
.facts span{font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.hint{margin:0;font:500 13px var(--font-mono);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend em{font-style:normal;font-size:13px;color:var(--muted)}

/* Tags */
.tag{display:inline-block;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1.5px solid currentColor;border-radius:2px;white-space:nowrap}
.t-architected{color:var(--accent)} .t-found{color:var(--warn)} .t-drove{color:var(--good)}
.tag.none{display:none}

/* Chips + flow */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.arr{color:var(--muted);font:500 16px var(--font-mono)}
.chip{
  border:1.5px solid var(--line); background:var(--surface); border-radius:4px; padding:7px 11px; min-height:38px;
  font:500 13px var(--font-mono); cursor:pointer; transition:border-color .15s, background .15s;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.detail{border-left:3px solid var(--accent);padding:2px 0 2px 14px;min-height:4.4rem;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.detail p{margin:0;font-size:15px;line-height:1.45}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:9px 14px;min-height:40px;font:500 13px var(--font-mono);white-space:nowrap}
.btn.outline{background:transparent;color:var(--accent)}
.fake{display:inline-block;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.cap{margin:0;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Code-ish blocks */
pre,code{font-family:var(--font-mono)}
pre{margin:0;font-size:12.5px;line-height:1.5;overflow:hidden}
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.rec>div{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 12px;flex:1 1 200px;min-width:0;transition:opacity .3s,border-color .3s}
.rec small,.ex{display:block;font:500 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rec .arr{align-self:center;flex:0}
.rec-b{opacity:.35;border-style:dashed!important}
.rec-b.on{opacity:1;border-style:solid!important;border-color:var(--accent)!important}
.log{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 12px;height:4.9em;white-space:pre;overflow:hidden}

/* Ingest animation */
.ing{width:100%;max-width:560px;height:auto;display:block}
.ing .kb{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ing .kb.hot{stroke:var(--accent);stroke-width:2}
.ing .kt{fill:var(--muted);font:500 7.5px var(--font-mono);letter-spacing:.06em}
.ing .pk{fill:var(--accent)}
.ing .pk.ok{fill:var(--good)}
.ing .fl{fill:none;stroke:var(--accent-ink);stroke-width:1.2}

/* Bulk list view */
.list{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;overflow:hidden}
.lhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 10px;border-bottom:1.5px solid var(--line)}
.sum{font:500 12px var(--font-mono);color:var(--muted)}
.sum b{color:var(--ink)}
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto 4.6rem;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:5px 10px;min-height:34px;cursor:pointer;font-size:14px}
.lrow:hover{background:var(--accent-soft)}
.box{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:2px;display:block;transition:background .15s}
.box.on{background:var(--accent);border-color:var(--accent)}
.am{font:500 13px var(--font-mono);font-variant-numeric:tabular-nums}
.st{text-align:right}
.st .pill{margin:0}
.lfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px}
.lfoot .ex{margin:0}

/* Enablement views */
.views{min-height:10.5rem}
.live{display:flex;flex-direction:column;gap:8px}
.lv{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 5.2rem;align-items:center;gap:10px;font:500 12px var(--font-mono)}
.lv i{display:block;height:12px;background:var(--accent);opacity:.85}
.lv b{text-align:right;font-variant-numeric:tabular-nums}
.fin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bal{border:1.5px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;transition:border-color .2s,background .2s}
.bal.yes{border-color:var(--accent);background:var(--accent-soft)}
.bal b{font:800 24px/1 var(--font-display);font-variant-numeric:tabular-nums}
.bal span{font:500 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bal.yes span{color:var(--accent)}
.finsum{margin:0;font:500 12px var(--font-mono);color:var(--muted)}
.finsum b{color:var(--ink)}

/* Payment */
.pay{display:flex;flex-direction:column;gap:10px}
.phone{border:1.5px solid var(--ink);background:var(--surface);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:10.5rem}
.msg{margin:0;font-size:14px;background:var(--accent-soft);padding:8px 10px;border-radius:3px;align-self:flex-start;max-width:34ch}
.res{margin:0;font-size:14px}
.rcpt{margin:0;font-size:13.5px;border:1.5px dashed var(--good);padding:6px 10px;border-radius:3px;align-self:flex-start;max-width:36ch}
.meta{font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;color:#fff;background:var(--muted);margin-right:6px}
:root[data-theme="dark"] .pill{color:#0C171B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#0C171B}}
.pill.good,.s-paid{background:var(--good)} .pill.s-created{background:var(--accent)} .s-cancelled{background:var(--warn)} .s-failed{background:var(--bad)}
.inv{display:flex;align-items:center;gap:8px;font:500 13px var(--font-mono);flex-wrap:wrap}

/* Banner */
.banner{border:1.5px solid var(--ink);background:var(--surface);border-radius:4px;padding:14px 16px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:7.6rem;margin-bottom:8px}
.banner small{display:block;font:500 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.banner .big{display:block;font:800 clamp(44px,11vw,60px)/.95 var(--font-display);color:var(--accent)}
.banner .mid{display:block;font:800 clamp(30px,7vw,40px)/1 var(--font-display);text-transform:uppercase}
.banner span.t{font-size:15px;color:var(--muted)}
.out{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}

/* Invoice journey scene */
.scene{flex:none;position:relative;width:100%;max-width:620px;aspect-ratio:2/1;container-type:inline-size;perspective:760px;border:1.5px solid var(--line);background:var(--viz-bg);overflow:hidden}
.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 5;vector-effect:non-scaling-stroke;opacity:0}
.glabel{position:absolute;left:50%;top:21%;transform:translate(-50%,-50%);font:500 clamp(9px,2.6cqw,12px) var(--font-mono);letter-spacing:.08em;color:var(--accent);background:var(--surface);border:1.5px solid var(--accent);padding:1px 6px;opacity:0}
.paper{position:absolute;left:22%;top:54%;width:34cqw;aspect-ratio:4/5;transform:translate(-50%,-50%);background:var(--paper);color:var(--paper-ink);box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.28);padding:2.6cqw;display:flex;flex-direction:column;gap:1.6cqw;font:500 2.5cqw/1 var(--font-mono)}
.paper .bars{display:block}
.paper .bars i{display:block;height:1cqw;background:var(--paper-line);margin-bottom:1.2cqw}
.paper .amt,.rc .amt{font:800 7cqw/1 var(--font-display)}
.paper .amt{margin-top:auto}
.stampmark{position:absolute;right:4cqw;bottom:11cqw;width:12cqw;height:12cqw;border:.7cqw solid var(--accent);border-radius:50%;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 2.2cqw/1.1 var(--font-mono);opacity:0;transform:rotate(-14deg)}
.stampmark em{font-style:normal;font-weight:500;letter-spacing:.1em}
.tool{position:absolute;right:3cqw;top:-2cqw;width:14cqw;height:20cqw;opacity:0;transform:translateY(-130%)}
.tool i{position:absolute;left:50%;transform:translateX(-50%);background:var(--paper-ink)}
.tool .kn{top:0;width:9cqw;height:9cqw;border-radius:50%}
.tool .sm{top:8cqw;width:3.4cqw;height:6cqw;background:var(--muted)}
.tool .bs{top:14cqw;width:14cqw;height:5cqw;border-radius:.8cqw}
.ph{position:absolute;left:76%;top:52%;width:24cqw;aspect-ratio:9/17.5;transform:translate(-50%,-50%);border:.9cqw solid var(--ink);border-radius:3.2cqw;background:var(--surface);overflow:hidden;box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.25)}
.ph::before{content:"";position:absolute;top:1cqw;left:50%;width:6cqw;height:.9cqw;border-radius:1cqw;background:var(--ink);transform:translateX(-50%);z-index:2}
.sc{position:absolute;inset:0;padding:4cqw 2cqw 2cqw;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.4cqw;font:500 2.5cqw/1.25 var(--font-body);text-align:center;opacity:0;transition:opacity .2s}
.sc.on{opacity:1}
.sc em{font:500 2.2cqw var(--font-mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sc b{font:800 4.6cqw/1 var(--font-display);text-transform:uppercase}
.bub{background:var(--accent-soft);padding:1.4cqw;border-radius:1.4cqw;text-align:left}
.paybtn{background:var(--accent);color:var(--accent-ink);padding:1cqw 2.4cqw;border-radius:1cqw;font:500 2.4cqw var(--font-mono)}
.chk{width:8cqw;height:8cqw}
.chk circle{fill:var(--good)}
.chk path{fill:none;stroke:var(--paper);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rc{position:absolute;left:22%;top:58%;width:26cqw;transform:translate(-50%,-50%) scale(.3);opacity:0;background:var(--paper);color:var(--paper-ink);box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.28);padding:2.2cqw;display:flex;flex-direction:column;gap:1.2cqw;font:500 2.4cqw/1 var(--font-mono)}
.rc em{font-style:normal;color:var(--good)}
@media (max-width:520px){.scene{aspect-ratio:16/9}.ph{width:28cqw}.rc{width:32cqw}.stage[data-key=journey] h2{font-size:32px}.stage[data-key=journey] .pin{gap:8px}}
@media (max-width:520px) and (max-height:700px){.scene{aspect-ratio:2/1}}
@media (max-height:700px){.note{display:none}}
.par{display:flex;flex-direction:column;gap:4px}
.par .seg{align-items:center}
.or{font:500 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font:500 11.5px var(--font-mono);color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.d-created{background:var(--accent)} .d-paid{background:var(--good)} .d-cancelled{background:var(--warn)} .d-failed{background:var(--bad)}
.stage[data-key=journey] .chip{padding:5px 9px;min-height:32px;font-size:12px}
.stage[data-key=journey] .flow .arr{display:none}
.stage[data-key=journey] .detail{min-height:3.6rem}

/* Blurred figures */
.num{display:inline-block;filter:blur(var(--bl,8px));transition:filter .35s}
.blur{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;display:inline-block}
.blur.on .num,.blur:focus-visible .num{filter:none}
@media (hover:hover){.blur:hover .num{filter:none}}
.blur.big{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px;--bl:16px}
.rv small{display:block;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rv b{display:block;font:900 clamp(56px,14vw,104px)/1.12 var(--font-display);color:var(--accent);font-variant-numeric:tabular-nums;margin:6px 0}
.rv.was b{color:var(--ink)}
.rv em{font:500 11px var(--font-mono);font-style:normal;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rarr{font:800 clamp(34px,8vw,56px)/1 var(--font-display);color:var(--accent);align-self:center}
.revhint{margin:0;display:flex;align-items:center;gap:8px;min-height:20px;font:500 12px var(--font-mono);letter-spacing:.04em;color:var(--accent);opacity:0;transition:opacity .6s;pointer-events:none}
.revhint svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:nudgeUp 1.6s ease-in-out infinite}
.revhint.show{opacity:.7}
@keyframes nudgeUp{50%{transform:translateY(-4px)}}

/* Financing: try it */
.try{margin:0;display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:4px;font-size:14px;line-height:1.35}
.try svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:bobDown 1.4s ease-in-out infinite}
@keyframes bobDown{50%{transform:translateY(4px)}}
